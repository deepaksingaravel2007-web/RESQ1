<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Radar Circles -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#ef4444" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="230" r="120" fill="none" stroke="#ef4444" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Emergency Shield Outline & Fill -->
  <path d="M256 90 L380 144 C380 260 256 360 256 360 C256 360 132 260 132 144 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Inner Shield Highlight -->
  <path d="M256 112 L358 158 C358 252 256 334 256 334 C256 334 154 252 154 158 Z"
        fill="#7f1d1d" fill-opacity="0.6"/>

  <!-- Emergency Cross / Pulse Line -->
  <!-- Cross Vertical -->
  <rect x="238" y="160" width="36" height="110" rx="8" fill="#ffffff"/>
  <!-- Cross Horizontal -->
  <rect x="201" y="197" width="110" height="36" rx="8" fill="#ffffff"/>

  <!-- Emergency Pulse Line -->
  <path d="M 180 215 L 225 215 L 240 180 L 256 250 L 272 195 L 285 215 L 332 215" 
        fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text RESQ -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="6">RESQ</text>
  
  <!-- Subtext 112 COMMAND -->
  <text x="256" y="468" text-anchor="middle" font-family="monospace" font-weight="700" font-size="20" fill="#fbbf24" letter-spacing="4">112 EMERGENCY</text>
</svg>

