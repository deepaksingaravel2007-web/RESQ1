name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Core & Android CLI
        run: npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Code into Android Project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Rename APK Output
        run: |
          find android/ -name "*.apk"
          cp $(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1) ./RESQ-Emergency-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESQ-Emergency-App-APK
          path: ./RESQ-Emergency-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RESQ Emergency Platform Build #${{ github.run_number }} (Android APK)"
          body: |
            ## 🚨 RESQ — Smart Emergency Response & Management Platform
            ### Android APK Direct Download
            
            Download the standalone Android `.apk` below:
            - **Filename:** `RESQ-Emergency-App.apk`
            - **Platform:** Android 7.0+ (Nougat through Android 15)
            - **Features:** 112 Triage, Live GPS Incident Map, Hospital Bed Trackers, Multilingual SOS.
          files: ./RESQ-Emergency-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
