name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Core & Android CLI (v6 LTS)
        run: npm install --save-dev @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Code into Android Project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || (tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Find and Rename APK Output
        run: |
          find android/ -name "*.apk"
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" ./RESQ-Emergency-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESQ-Emergency-App-APK
          path: ./RESQ-Emergency-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "🚨 RESQ Emergency Platform (Android APK)"
          body: |
            ## 🚨 RESQ — Smart Emergency Response & Management Platform
            ### Android APK Direct Download
            
            Download the standalone Android `.apk` below:
            - **Filename:** `RESQ-Emergency-App.apk`
            - **Platform:** Android 7.0+ (Nougat through Android 15)
            - **Package:** `org.resq.emergency.app`
            - **Features:** 112 SOS Report, Live GPS Incident Map, Hospital Bed Coordination, Multilingual Triage.
          files: ./RESQ-Emergency-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
